name: daily-signal

on:
  schedule:
    # QDII 净值一般 20:00-23:00（北京时间）披露，跑两次保险
    - cron: "0 12 * * *"   # 每天 20:00 (UTC+8)
    - cron: "0 14 * * *"   # 每天 22:00 (UTC+8)
  workflow_dispatch:        # 允许手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update data & signals
        run: python update.py --report

      - name: Push notification (optional)
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BARK_URL: ${{ secrets.BARK_URL }}
        run: python update.py --notify

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ || true
          git diff --staged --quiet || git commit -m "chore: daily signal update $(date -u +%Y-%m-%d)"
          git push
